name: Java CI

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Cancel in-progress runs for the same ref (e.g. when pushing new commits to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # JDK 25 is used for testing robot security without the SecurityManager (removed with Java 24).
      # The last listed version (17) is the default JDK.
      - name: Set up JDK 25 and 17
        uses: actions/setup-java@v6
        with:
          java-version: |
            25
            17
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Test with Java 25
        run: ./gradlew test -PtestJavaVersion=25 --stacktrace

      - name: robocode.core test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robocode.core-test-result
          path: robocode.core/build/reports/tests/test

      - name: robocode.host test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robocode.host-test-result
          path: robocode.host/build/reports/tests/test

      - name: robocode.tests test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robocode.tests-result
          path: robocode.tests/build/reports/tests/test

      - name: setup binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: robocode-setup
          path: build/robocode-*-setup.jar

      - name: Publish test results summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit test results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          # The Gradle steps fail the build on test failures. They retry flaky robot battle tests, but the failed
          # attempts are still in the test results, so the summary must not fail the build because of these.
          fail-on-error: false
